---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-backup
  namespace: jellyfin
spec:
  schedule: "0 5 * * *"
  timeZone: "America/Detroit"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              curl 'http://jellyfin.jellyfin.svc.cluster.local:8096/Backup/Create' \
                -X POST \
                -H 'Content-Type: application/json' \
                -H "X-Emby-Token: ${JELLYFIN_TOKEN}" \
                --data-raw '{"Metadata":false,"Trickplay":false,"Subtitles":false}'
            env:
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-backup-token
                  key: token
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scan-movies
  namespace: jellyfin
spec:
  schedule: "0 2 * * *"
  timeZone: "America/Detroit"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: scan
            image: curlimages/curl:latest
            command:
            - /bin/sh
            - -c
            - |
                curl -v -X POST \
                -H "Authorization: MediaBrowser Token=\"${JELLYFIN_TOKEN}\"" \
                'https://dvr.crt.lol/Items/f137a2dd21bbc1b99aa5c0f6bf02a805/Refresh?Recursive=true&ImageRefreshMode=Default&MetadataRefreshMode=Default&ReplaceAllImages=false&RegenerateTrickplay=false&ReplaceAllMetadata=false'
            env:
            - name: JELLYFIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scan-token
                  key: token
---
